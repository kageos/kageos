name: Kagebase Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, for example 0.2.0. A leading v is accepted."
        required: true
        default: "0.2.0"
      push_latest:
        description: "Also update qiayanai/kagebase:latest"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/qiayanai/kagebase

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      push_latest: ${{ steps.release.outputs.push_latest }}
    steps:
      - name: Resolve version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            push_latest="true"
          else
            version="${INPUT_VERSION}"
            version="${version#v}"
            push_latest="${INPUT_PUSH_LATEST}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version must look like 0.2.0, got: $version" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "push_latest=${push_latest}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push native architecture image
        uses: docker/build-push-action@v7
        with:
          context: deploy/base/images/app-base
          file: deploy/base/images/app-base/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.metadata.outputs.version }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=Kagebase
            org.opencontainers.image.description=Kageos user application runtime base image
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_DEFAULT_TIMEOUT=300
            PIP_RETRIES=10
            UBUNTU_APT_MIRROR=http://archive.ubuntu.com/ubuntu
            UBUNTU_PORTS_APT_MIRROR=http://ports.ubuntu.com/ubuntu-ports
            APT_CHECK_DATE=1
          cache-from: type=gha,scope=kagebase-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=kagebase-${{ matrix.suffix }}

  publish:
    name: Publish multi-arch manifest
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and verify release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PUSH_LATEST: ${{ needs.metadata.outputs.push_latest }}
        run: |
          set -euo pipefail

          version_ref="${IMAGE_NAME}:${RELEASE_VERSION}"
          amd64_ref="${version_ref}-amd64"
          arm64_ref="${version_ref}-arm64"

          docker buildx imagetools create --tag "$version_ref" "$amd64_ref" "$arm64_ref"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "$version_ref"
          fi

          manifest="$(docker buildx imagetools inspect "$version_ref")"
          printf '%s\n' "$manifest"
          grep -q 'Platform:.*linux/amd64' <<<"$manifest"
          grep -q 'Platform:.*linux/arm64' <<<"$manifest"

      - name: Sync image to Aliyun ACR
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PUSH_LATEST: ${{ needs.metadata.outputs.push_latest }}
          ALIYUN_REGISTRY: ${{ vars.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ALIYUN_REGISTRY:-}" || -z "${ALIYUN_NAMESPACE:-}" || -z "${ALIYUN_REGISTRY_USERNAME:-}" || -z "${ALIYUN_REGISTRY_PASSWORD:-}" ]]; then
            echo "Aliyun registry is not configured; skipping image sync."
            exit 0
          fi

          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi

          copy_image() {
            local source="$1"
            local target="$2"
            local attempt

            for attempt in 1 2 3; do
              echo "Copying ${source} -> ${target} (attempt ${attempt}/3)"
              if timeout 30m skopeo copy --all "$source" "$target"; then
                skopeo inspect --format 'Target digest: {{.Digest}}' "$target" || true
                return 0
              fi

              echo "Copy failed for ${target}"
              if [[ "$attempt" -lt 3 ]]; then
                sleep $((attempt * 30))
              fi
            done

            return 1
          }

          source_image="docker://${IMAGE_NAME}:${RELEASE_VERSION}"
          target_image="docker://${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/kagebase"

          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | skopeo login --username "$ALIYUN_REGISTRY_USERNAME" --password-stdin "$ALIYUN_REGISTRY"
          copy_image "$source_image" "${target_image}:${RELEASE_VERSION}"
          if [[ "$PUSH_LATEST" == "true" ]]; then
            copy_image "$source_image" "${target_image}:latest"
          fi
