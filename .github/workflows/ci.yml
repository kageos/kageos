name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  governance:
    name: Governance Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sensitive file boundaries
        run: bash scripts/check-sensitive-files.sh
      - name: Check repository size guard
        run: bash scripts/check-repo-size-guard.sh
      - name: Check markdown links
        run: bash scripts/check-doc-links.sh
      - name: Check context propagation boundaries
        run: bash scripts/check-context-boundaries.sh
      - name: Check service database ownership boundaries
        run: bash scripts/check-service-db-boundaries.sh
      - name: Checkout SDK contract
        uses: actions/checkout@v4
        with:
          repository: kageos/kageos-sdk
          path: .ci/kageos-sdk
      - name: Check SDK import boundaries
        env:
          KAGEOS_SDK_ROOT: ${{ github.workspace }}/.ci/kageos-sdk
        run: bash scripts/check-sdk-boundaries.sh

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install backend system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            libc6-dev \
            libdevmapper-dev \
            libgpgme-dev \
            pkg-config
      - name: Vet backend packages
        run: go vet -tags exclude_graphdriver_btrfs ./cmd/... ./core/... ./dto/... ./pkg/...
      - name: Test core packages
        run: bash scripts/test-core-go.sh
      - name: Run Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./core/... ./dto/... ./pkg/...

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check architecture boundaries
        run: npm run check:architecture
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit -- --run
      - name: Build
        run: npm run build
