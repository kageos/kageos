name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

jobs:
  governance:
    name: Governance Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check sensitive file boundaries
        run: bash scripts/check-sensitive-files.sh
      - name: Check repository size guard
        run: bash scripts/check-repo-size-guard.sh
      - name: Check markdown links
        run: bash scripts/check-doc-links.sh
      - name: Checkout SDK contract
        uses: actions/checkout@v6
        with:
          repository: kageos/kageos-sdk
          path: .ci/kageos-sdk
      - name: Check SDK import boundaries
        env:
          KAGEOS_SDK_ROOT: ${{ github.workspace }}/.ci/kageos-sdk
        run: bash scripts/check-sdk-boundaries.sh

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install backend system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            libc6-dev \
            libdevmapper-dev \
            libgpgme-dev \
            pkg-config
      - name: Vet backend packages
        run: go vet -tags exclude_graphdriver_btrfs ./cmd/... ./core/... ./dto/... ./pkg/...
      - name: Test core packages
        run: bash scripts/test-core-go.sh
      - name: Run Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./core/... ./dto/... ./pkg/...

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Check architecture boundaries
        run: npm run check:architecture
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:unit -- --run
      - name: Build
        run: npm run build

  frontend-public-e2e:
    name: Frontend Public E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test unauthenticated login route
        run: npm run test:e2e:login

  kagebase-definition:
    name: Kagebase Dockerfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Validate runtime image definition
        uses: docker/build-push-action@v7
        with:
          context: deploy/base/images/app-base
          file: deploy/base/images/app-base/Dockerfile
          call: check
