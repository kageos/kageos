name: Docker Retag

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image name under qiayanai, for example kageos or kagebase."
        required: true
        default: "kageos"
      source_tag:
        description: "Existing source tag, for example 0.1.3."
        required: true
      target_tag:
        description: "Tag to update, for example latest."
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  retag:
    name: Retag Docker Hub image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image="${{ inputs.image }}"
          source_tag="${{ inputs.source_tag }}"
          target_tag="${{ inputs.target_tag }}"

          if [[ ! "$image" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "invalid image name: $image" >&2
            exit 1
          fi
          if [[ ! "$source_tag" =~ ^[A-Za-z0-9._-]+$ || ! "$target_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "invalid tag: ${source_tag} -> ${target_tag}" >&2
            exit 1
          fi

          {
            echo "image=docker.io/qiayanai/${image}"
            echo "source_tag=${source_tag#v}"
            echo "target_tag=${target_tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Retag image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}"
          source_tag="${{ steps.image.outputs.source_tag }}"
          target_tag="${{ steps.image.outputs.target_tag }}"

          docker buildx imagetools inspect "${image}:${source_tag}" >/dev/null
          docker buildx imagetools create \
            --tag "${image}:${target_tag}" \
            "${image}:${source_tag}"
