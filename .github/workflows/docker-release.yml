name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version, for example 0.2.0. A leading v is accepted."
        required: true
        default: "0.2.0"
      push_latest:
        description: "Also update qiayanai/kageos:latest"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/qiayanai/kageos

jobs:
  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve tags
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            push_latest="true"
          else
            version="${{ inputs.version }}"
            version="${version#v}"
            push_latest="${{ inputs.push_latest }}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version must look like 0.2.0, got: $version" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "push_latest=${push_latest}"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            if [[ "$push_latest" == "true" ]]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/aio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Kageos
            org.opencontainers.image.description=Kageos all-in-one local image
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            APT_USE_MIRROR=0
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            NPM_REGISTRY=https://registry.npmjs.org
            KAGEOS_DEFAULT_APP_BASE_IMAGE=docker.io/qiayanai/kagebase:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release archives
        shell: bash
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          release_dir="dist/r2/releases/v${version}"
          public_base="${R2_PUBLIC_BASE_URL:-https://downloads.kageos.com}"
          mkdir -p "$release_dir"

          for arch in amd64 arm64; do
            image_ref="${IMAGE_NAME}:${version}"
            archive="kageos-linux-${arch}.tar.gz"

            docker image rm "$image_ref" >/dev/null 2>&1 || true
            docker pull --platform "linux/${arch}" "$image_ref"
            docker save "$image_ref" | gzip -6 > "${release_dir}/${archive}"
            sha256sum "${release_dir}/${archive}" > "${release_dir}/${archive}.sha256"
            docker image rm "$image_ref" >/dev/null 2>&1 || true
          done

          amd64_sha="$(awk '{print $1}' "${release_dir}/kageos-linux-amd64.tar.gz.sha256")"
          arm64_sha="$(awk '{print $1}' "${release_dir}/kageos-linux-arm64.tar.gz.sha256")"
          cat > "${release_dir}/manifest.json" <<EOF
          {
            "version": "v${version}",
            "image": "${IMAGE_NAME}:${version}",
            "archives": {
              "linux/amd64": {
                "url": "${public_base%/}/releases/v${version}/kageos-linux-amd64.tar.gz",
                "sha256": "${amd64_sha}"
              },
              "linux/arm64": {
                "url": "${public_base%/}/releases/v${version}/kageos-linux-arm64.tar.gz",
                "sha256": "${arm64_sha}"
              }
            }
          }
          EOF

      - name: Upload release archives to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          set -euo pipefail

          if [[ -z "${R2_ACCOUNT_ID:-}" || -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "R2 credentials are not configured; skipping archive upload."
            exit 0
          fi

          version="${{ steps.release.outputs.version }}"
          push_latest="${{ steps.release.outputs.push_latest }}"
          release_dir="dist/r2/releases/v${version}"
          bucket="${R2_BUCKET:-kageos-releases}"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            export PATH="${HOME}/.local/bin:${PATH}"
          fi

          aws --endpoint-url "$endpoint" s3 sync "$release_dir" "s3://${bucket}/releases/v${version}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          if [[ "$push_latest" == "true" ]]; then
            mkdir -p dist/r2/releases
            printf 'v%s\n' "$version" > dist/r2/releases/latest.txt
            aws --endpoint-url "$endpoint" s3 cp dist/r2/releases/latest.txt "s3://${bucket}/releases/latest.txt" \
              --cache-control "no-cache, max-age=60"
          fi
