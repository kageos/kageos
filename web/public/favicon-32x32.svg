<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Kageos app icon</title>
  <desc id="desc">Kageos app icon using the selected Kage Blade logo direction.</desc>
  <defs>
    <linearGradient id="bladeGradient" x1="116" y1="94" x2="396" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="65%">
      <stop stop-color="#67e8f9" stop-opacity="0.34"/>
      <stop offset="0.54" stop-color="#f43f5e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="bladeGlow" x="-35%" y="-35%" width="170%" height="180%">
