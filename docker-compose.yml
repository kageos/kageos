# AI Agent OS - Docker Compose 一键部署
# 使用: docker compose up -d
# 首次部署请先阅读 docker/DEPLOY.md

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: ai-agent-os-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-agent-os

  nats:
    image: nats:latest
    container_name: ai-agent-os-nats
    restart: always
    ports:
      - "4222:4222"
    volumes:
      - ./docker/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks:
      - ai-agent-os

  minio:
    image: minio/minio:latest
    container_name: ai-agent-os-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-agent-os

  # ==================== Go 后端（统一启动） ====================

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: ai-agent-os-backend:latest
    container_name: ai-agent-os-backend
    restart: always
    privileged: true
    ports:
      - "9090:9090"
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
      - "9095:9095"
      - "9096:9096"
      - "9097:9097"
    volumes:
      # docker-compose 专用配置覆盖
      - ./docker/configs/global.yaml:/app/configs/global.yaml:ro
      - ./docker/configs/api-gateway.yaml:/app/configs/api-gateway.yaml:ro
      - ./docker/configs/app-server.yaml:/app/configs/app-server.yaml:ro
      - ./docker/configs/app-storage.yaml:/app/configs/app-storage.yaml:ro
      - ./docker/configs/app-runtime.yaml:/app/configs/app-runtime.yaml:ro
      - ./docker/configs/agent-server.yaml:/app/configs/agent-server.yaml:ro
      - ./docker/configs/hr-server.yaml:/app/configs/hr-server.yaml:ro
      - ./docker/configs/control-service.yaml:/app/configs/control-service.yaml:ro
      # Hub Server 配置（通过 /config/hub.yaml 软链接指向此处）
      - ./docker/configs/hub.yaml:/app/hub-config/hub.yaml:ro
      # Podman 容器存储（持久化用户应用镜像和容器）
      - podman-storage:/var/lib/containers
      # 持久化数据
      - namespace-data:/app/namespace
      - app-runtime-data:/app/data
      - backend-logs:/app/logs
      - license-data:/app/license
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-agent-os

  # ==================== Web 主前端 ====================

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: ai-agent-os-web:latest
    container_name: ai-agent-os-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-agent-os

  # ==================== Hub 前端 ====================

  hub-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.hub-frontend
    image: ai-agent-os-hub-frontend:latest
    container_name: ai-agent-os-hub-frontend
    restart: always
    ports:
      - "81:80"
    depends_on:
      - backend
    networks:
      - ai-agent-os

# ==================== 数据卷 ====================
volumes:
  mysql-data:
    name: ai-agent-os-mysql-data
  minio-data:
    name: ai-agent-os-minio-data
  podman-storage:
    name: ai-agent-os-podman-storage
  namespace-data:
    name: ai-agent-os-namespace-data
  app-runtime-data:
    name: ai-agent-os-app-runtime-data
  backend-logs:
    name: ai-agent-os-backend-logs
  license-data:
    name: ai-agent-os-license-data

# ==================== 网络 ====================
networks:
  ai-agent-os:
    name: ai-agent-os
    driver: bridge
