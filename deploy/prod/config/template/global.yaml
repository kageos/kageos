# 客户一键部署（Docker Compose）— 全局
# 模板由容器 entrypoint 使用 envsubst 渲染
gateway:
  host: "0.0.0.0"
  port: 9090
  base_url: "http://127.0.0.1:9090"
  internal_url: "http://127.0.0.1:9090"

scheduler:
  embedded: false

nats:
  url: "nats://127.0.0.1:4222"

jwt:
  secret: "${JWT_SECRET}"
  access_token_expire: 2592000
  refresh_token_expire: 7776000
  issuer: "ai-agent-os"

control_service:
  enabled: true
  encryption_key: "${CONTROL_ENC_KEY}"
  key_path: "/app/data/license/license.key"

sdk:
  nats_url: "nats://127.0.0.1:4222"
  gateway_url: "http://127.0.0.1:9090"
  env_vars:
    FFMPEG_PATH: "/usr/bin/ffmpeg"
    GHOSTSCRIPT_PATH: "/usr/bin/gs"
    PDFTOTEXT_PATH: "/usr/bin/pdftotext"
    PDFINFO_PATH: "/usr/bin/pdfinfo"
    PDFIMAGES_PATH: "/usr/bin/pdfimages"
    PDFTOPPM_PATH: "/usr/bin/pdftoppm"
    GRAPHICSMAGICK_PATH: "/usr/bin/gm"
    LUA_PATH: "/usr/bin/lua"
    PYTHON_PATH: "/usr/bin/python3"
    PIP_PATH: "/usr/bin/pip3"
