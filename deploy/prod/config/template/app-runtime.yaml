runtime:
  port: 9093
  listen_host: "127.0.0.1"
  log_level: "info"
  debug: false

timeouts:
  app_server_request: 30
  container_startup: 2
  app_startup_notification: 300
  update_callback: 240
  container_cleanup: 10

app_manage:
  app_dir:
    base_path: "/app/namespace"
  build:
    # Set true only when a release binary must be inspected with a debugger.
    keep_debug_symbols: false

container:
  timeout: 30
  network_mode: "host"
  image:
    base_image: "${KAGEOS_APP_BASE_IMAGE}"

app_database:
  enabled: true
  dialect: "mysql"
  host: "${MYSQL_HOST}"
  port: ${MYSQL_PORT}
  admin_user: "root"
  admin_password: "${MYSQL_ROOT_PASSWORD}"
  grant_host: "%"
  secret_key: "${KAGEOS_APP_DB_SECRET_KEY}"
  cluster_key: "${KAGEOS_APP_DB_CLUSTER_KEY}"
  database_prefix: "kgo_"
  user_prefix: "kgu_"
  max_open_conns: 2
  max_idle_conns: 0
  max_idle_time: 30
  max_lifetime: 600
