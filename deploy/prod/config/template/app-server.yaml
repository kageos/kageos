# App Server（客户）
server:
  port: 9091
  listen_host: "127.0.0.1"
  log_level: "info"
  debug: false
  enable_pprof: false

scheduler:
  poll_interval_seconds: 1
  batch_size: 50
  lease_duration_seconds: 360
  max_concurrency: 4

db:
  type: "mysql"
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "${MYSQL_ROOT_PASSWORD}"
  name: "app_db"
  max_idle_conns: 30
  max_open_conns: 200
  max_lifetime: 300
  log_level: "warn"
  slow_threshold: 200

timeouts:
  app_request: 300
  nats_request: 300
