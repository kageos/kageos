# 客户部署：MinIO 在 compose 服务 minio；cdn_domain 空则由 CANONICAL_BASE_URL 注入
server:
  port: 9092
  listen_host: "127.0.0.1"
  log_level: "info"
  debug: false
  enable_pprof: false

audit:
  upload_tracking:
    enabled: true
  download_tracking:
    enabled: true
    retention_days: 90

storage:
  type: "minio"
  minio:
    endpoint: "127.0.0.1:9000"
    server_endpoint: ""
    access_key: "${MINIO_ROOT_USER}"
    secret_key: "${MINIO_ROOT_PASSWORD}"
    use_ssl: false
    region: "us-east-1"
    default_bucket: "ai-agent-os"
    cdn_domain: ""
  upload:
    max_size: 4294967296
    token_expire: 3600
    allowed_types:
      - "image/*"
      - "video/*"
      - "application/pdf"
      - "application/msword"
      - "application/vnd.ms-excel"
      - ".txt"
      - ".csv"
  deduplication:
    enabled: false
    hash_algorithm: "sha256"
  cache:
    enabled: true
    max_age: 31536000

db:
  type: "mysql"
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "${MYSQL_ROOT_PASSWORD}"
  name: "app-storage"
  max_idle_conns: 10
  max_open_conns: 100
  max_lifetime: 300
  log_level: "info"
  slow_threshold: 200
