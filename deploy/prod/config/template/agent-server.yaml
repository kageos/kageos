server:
  port: 9095
  listen_host: "127.0.0.1"
  log_level: "info"
  debug: false
  enable_pprof: false

scheduler:
  poll_interval_seconds: 5
  batch_size: 20
  lease_duration_seconds: 600
  max_concurrency: 3
  default_timeout_seconds: 300

db:
  type: "mysql"
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "${MYSQL_ROOT_PASSWORD}"
  name: "agent-server"
  max_idle_conns: 10
  max_open_conns: 100
  max_lifetime: 300
  log_level: "info"
  slow_threshold: 200
