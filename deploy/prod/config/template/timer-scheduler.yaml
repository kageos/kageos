server:
  port: 9098
  listen_host: "127.0.0.1"
  log_level: "info"
  debug: false
  enable_pprof: false

db:
  type: "mysql"
  host: "${MYSQL_HOST}"
  port: ${MYSQL_PORT}
  user: "root"
  password: "${MYSQL_ROOT_PASSWORD}"
  name: "timer-scheduler"
  max_idle_conns: 10
  max_open_conns: 100
  max_lifetime: 300
  log_level: "warn"
  slow_threshold: 200

scheduler:
  poll_interval_millis: 1000
  batch_size: 50
  dispatch_lease_seconds: 30
  execution_lease_seconds: 180
  queue_ack_timeout_seconds: 120
  max_dispatch_attempts: 3
  max_heartbeat_misses: 3
  max_outbox_attempts: 8
  payload_limit_bytes: 262144
