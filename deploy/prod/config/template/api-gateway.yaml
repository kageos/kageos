# 客户主站交付：不包含 Hub 路由（Hub 为公司自建实例）
server:
  port: 9090
  listen_host: "127.0.0.1"
  log_level: "info"
  debug: false
  enable_pprof: false
  allow_nats_degraded_startup: false

routes:
  - path: "/storage"
    service_name: "storage"
    targets:
      - url: "http://127.0.0.1:9092"
    timeout: 300

  - path: "/agent"
    service_name: "agent"
    targets:
      - url: "http://127.0.0.1:9095"
    timeout: 300

  - path: "/workspace"
    service_name: "workspace"
    targets:
      - url: "http://127.0.0.1:9091"
    timeout: 300

  - path: "/public/api"
    service_name: "workspace-public"
    targets:
      - url: "http://127.0.0.1:9091"
    timeout: 300

  - path: "/hr"
    service_name: "hr"
    targets:
      - url: "http://127.0.0.1:9097"
    timeout: 300

  - path: "/connector"
    service_name: "connector"
    targets:
      - url: "http://127.0.0.1:9096"
    timeout: 300

timeouts:
  default: 300
