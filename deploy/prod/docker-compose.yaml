# 生产单机一键部署（不含 Hub）
# 用法：bash build.sh init [--image] → 填 .env → bash build.sh up
# 如需显式预检，可在 up 前手动执行：bash build.sh doctor

services:
  # ─── 中间件 ──────────────────────────────────────────────────
  mysql:
    image: ${MYSQL_IMAGE:-docker.io/library/mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - /data/ai-agent-os/mysql:/var/lib/mysql
      - ../base/infra/mysql/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [aos]

  nats:
    image: ${NATS_IMAGE:-docker.io/library/nats:2.10-alpine}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4222:4222"
    volumes:
      - ../base/infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks: [aos]

  minio:
    image: ${MINIO_IMAGE:-docker.io/minio/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /data/ai-agent-os/minio:/data
    networks: [aos]

  # ─── 主服务（host 网络，容器内 Nginx 直接对外 80 / 443）───────
  main:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
    image: ${MAIN_IMAGE:-agentos-main:latest}
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      CANONICAL_BASE_URL: ${CANONICAL_BASE_URL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CONTROL_ENC_KEY: ${CONTROL_ENC_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI Agent OS}
      TLS_MODE: ${TLS_MODE:-http}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/app/tls/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/app/tls/privkey.pem}
      APP_BASE_IMAGE: ${APP_BASE_IMAGE:-agentos-app-runtime-base:latest}
    volumes:
      - /data/ai-agent-os/podman_storage:/var/lib/containers
      - /data/ai-agent-os/logs:/app/logs
      - /data/ai-agent-os/namespace:/app/namespace
      - /data/ai-agent-os/data:/app/data
      - ${TLS_CERTS_HOST_DIR:-./certs}:/app/tls:ro
    depends_on:
      - mysql
      - minio
    healthcheck:
      test: ["CMD", "/app/health/main.sh"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s

  scheduler:
    image: ${MAIN_IMAGE:-agentos-main:latest}
    entrypoint: ["/app/entrypoint-scheduler.sh"]
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CONTROL_ENC_KEY: ${CONTROL_ENC_KEY}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-AI Agent OS}
      APP_BASE_IMAGE: ${APP_BASE_IMAGE:-agentos-app-runtime-base:latest}
    volumes:
      - /data/ai-agent-os/logs:/app/logs
      - /data/ai-agent-os/namespace:/app/namespace
      - /data/ai-agent-os/data:/app/data
    depends_on:
      - main
      - mysql
      - nats
      - minio
    healthcheck:
      test: ["CMD", "/app/health/scheduler.sh"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  backup:
    image: ${MAIN_IMAGE:-agentos-main:latest}
    entrypoint: ["/app/entrypoint-backup.sh"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_BASIC_AUTH_PASSWORD: ${BACKUP_BASIC_AUTH_PASSWORD}
    ports:
      - "127.0.0.1:19088:19088"
    volumes:
      - /data/ai-agent-os/logs:/app/logs
      - /data/ai-agent-os/namespace:/app/namespace:ro
      - /data/ai-agent-os/data:/app/data
      - /data/ai-agent-os/mysql:/storage/mysql:ro
      - /data/ai-agent-os/minio:/storage/minio:ro
      - /data/ai-agent-os/podman_storage:/storage/podman_storage:ro
    depends_on:
      - mysql
      - nats
      - minio
    healthcheck:
      test: ["CMD", "/app/health/backup.sh"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks: [aos]

networks:
  aos:
    name: ai-agent-os-customer-aos
