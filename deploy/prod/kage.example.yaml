site:
  base_url: "http://your-ip-or-domain"
  tls_mode: "http"
  cert_file: "/app/tls/fullchain.pem"
  key_file: "/app/tls/privkey.pem"
  tls_cert_pem_b64: ""
  tls_key_pem_b64: ""

images:
  main: "localhost/kageos-main:latest"
  app_base: "kagebase:latest"
  mysql: "docker.io/library/mysql:8.0"
  nats: "docker.io/library/nats:2.10-alpine"
  minio: "docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"

storage:
  root: "/home/kageos/.kageos/storage/prod"

mysql:
  mode: "bundled"
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "replace-with-a-strong-mysql-password"
  app_database: "app-server"
  agent_database: "agent-server"
  connector_database: "connector-server"
  storage_database: "app-storage"
  hr_database: "hr-server"
  timer_database: "timer-scheduler"
  message_database: "message-server"
  create_bundled_sql: true

nats:
  mode: "bundled"
  host: "127.0.0.1"
  port: 4222
  auth_enabled: true
  user: "aos"
  password: "replace-with-a-strong-nats-password"
  url: ""

minio:
  mode: "bundled"
  endpoint: "127.0.0.1:9000"
  root_user: "minioadmin"
  root_password: "replace-with-a-strong-minio-password"
  access_key: "minioadmin"
  secret_key: "replace-with-a-strong-minio-password"
  use_ssl: false
  region: "us-east-1"
  bucket: "kageos"

secrets:
  jwt_secret: "0123456789abcdef0123456789abcdef"
  generated_by_kagectl: false
  generated_at_unix_seconds: 0

system_user:
  password: "replace-with-a-strong-system-password"

company:
  code: "default"
  name: "Default"
  logo_url: ""

auth:
  # admin_only: only system-created users can sign in.
  # email_code: self-service registration requires complete SMTP settings.
  # debug_code: local/internal testing only.
  registration_mode: "admin_only"

llms:
  # 可选。配置后 agent-server 启动时会幂等初始化到 LLM 管理页面。
  default: "main"
  configs:
    - code: "main"
      name: "默认模型"
      model: "gpt-4o-mini"
	      # 推荐用环境变量注入密钥；api_base 不填时走 OpenAI SDK 默认地址。
	      # api_base 仅用于受控部署或代理场景下覆盖 OpenAI API base URL。
      api_key_env: "OPENAI_API_KEY"
      api_base: ""
      timeout: 300
      max_tokens: 8192
      visibility: 0
      admin: "system"

smtp:
  mode: "smtp"
  host: "smtp.qq.com"
  port: 587
  username: ""
  password: ""
  from: ""
  from_name: "Kageos"
