# =============================================================================
# 可选配置：用域名反代到本机 Embedding 已监听的端口
#
# - geeleo.com（示例，请改成你的主域）→ 127.0.0.1:8999（主站 Web）
# - hub.geeleo.com → 127.0.0.1:8998（Hub 前端）
#
# 使用前提：
#   1) 本机已能访问 http://127.0.0.1:8999 与 :8998（embedding.sh nginx / init 已跑通）
#   2) 域名 DNS **已 A/AAAA 指到本机公网 IP** 后再启用本文件（否则不必安装）
#   3) 云安全组 / 防火墙放行 **80**（HTTP）、若上 HTTPS 再放行 **443**
#
# 安装示例（复制后编辑域名，未上证书前可只用下面「仅 HTTP」段）：
#   sudo cp nginx-domain-proxy.example.conf /etc/nginx/sites-available/ai-agent-os-domain.conf
#   sudo nano /etc/nginx/sites-available/ai-agent-os-domain.conf
#   sudo ln -sf /etc/nginx/sites-available/ai-agent-os-domain.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 不想用域名时：**不要** ln 到 sites-enabled，或删掉该软链即可；8999/8998 直连不受影响。
# =============================================================================

# ----- 仅 HTTP（测试或内网，无证书）-----
# 若公网暴露 HTTP，生产建议尽快换 HTTPS（certbot 等）。

server {
    listen 80;
    server_name geeleo.com www.geeleo.com;

    location / {
        proxy_pass http://127.0.0.1:8999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 4096m;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name hub.geeleo.com;

    location / {
        proxy_pass http://127.0.0.1:8998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 4096m;
    }
}

