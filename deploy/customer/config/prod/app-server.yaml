# App Server（客户）
server:
  port: 9091
  log_level: "info"
  debug: false

db:
  type: "mysql"
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "__MYSQL_ROOT_PASSWORD__"
  name: "app_db"
  max_idle_conns: 30
  max_open_conns: 200
  max_lifetime: 300
  log_level: "warn"
  slow_threshold: 200

timeouts:
  app_request: 300
  nats_request: 300

email:
  smtp:
    host: "__SMTP_HOST__"
    port: __SMTP_PORT__
    username: "__SMTP_USERNAME__"
    password: "__SMTP_PASSWORD__"
    from: "__SMTP_FROM__"
    from_name: "__SMTP_FROM_NAME__"
  verification:
    code_length: 6
    code_expire: 300
