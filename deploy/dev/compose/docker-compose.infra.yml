# AI Agent OS - 基础设施（NATS / MySQL / MinIO）
# 用于 Podman 本地开发：容器名必须为 mysql8、nats-server、minio，与 app-runtime InfraWatchdog 一致。
#
# 基础设施账号（与 configs 中各服务 db/storage 配置一致）:
#   MySQL  端口 3306  root / root           数据库由 deploy/base/infra/mysql/init-db.sql 首次启动时自动创建
#   MinIO  端口 9000  minioadmin / minioadmin123  控制台 http://localhost:9001
#   NATS   端口 4222  无认证
#
# 用法（先确保 Podman Machine 已启动）:
#   podman machine start
#   podman compose -f deploy/dev/compose/docker-compose.infra.yml up -d
# 停止:
#   podman compose -f deploy/dev/compose/docker-compose.infra.yml down
# 清除数据:
#   podman compose -f deploy/dev/compose/docker-compose.infra.yml down -v

services:

  mysql8:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - infra-mysql-data:/var/lib/mysql
      - ../../base/infra/mysql/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nats-server:
    image: nats:latest
    container_name: nats-server
    restart: unless-stopped
    ports:
      - "4222:4222"
    volumes:
      - ../../base/infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - infra-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  infra-mysql-data:
    name: ai-agent-os-infra-mysql-data
  infra-minio-data:
    name: ai-agent-os-infra-minio-data
