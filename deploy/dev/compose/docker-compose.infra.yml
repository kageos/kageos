# Kageos - 基础设施（NATS / MySQL / MinIO）
# 用于 Podman 本地开发：容器名必须为 mysql8、nats-server、minio，与 app-runtime InfraWatchdog 一致。
# 因为这层约束，Podman 版本单独保留一份 compose，而不是和 Docker 版本强行复用。
#
# 基础设施账号由 .kageos/dev/env/kageos.env 生成并注入。
#
# 用法（先确保 Podman Machine 已启动）:
#   podman machine start
#   podman compose -f deploy/dev/compose/docker-compose.infra.yml up -d
# 停止:
#   podman compose -f deploy/dev/compose/docker-compose.infra.yml down
# 清除数据:
#   podman compose -f deploy/dev/compose/docker-compose.infra.yml down -v

services:

  mysql8:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3318}:3306"
    volumes:
      - infra-mysql-data:/var/lib/mysql
      - ../../base/infra/mysql/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nats-server:
    image: nats:2.10-alpine
    container_name: nats-server
    restart: unless-stopped
    ports:
      - "4222:4222"
    volumes:
      - ../../base/infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["--user", "${NATS_SEED_USER:-kageos}", "--pass", "${NATS_SEED_PASSWORD:-local-dev-nats}", "-c", "/etc/nats/nats-server.conf"]

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - infra-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  infra-mysql-data:
    name: kageos-dev-mysql3318-data
  infra-minio-data:
    name: kageos-infra-minio-data
