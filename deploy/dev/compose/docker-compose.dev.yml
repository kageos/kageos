# kageos - 开发环境基础设施（Docker 版本）
# 与 docker-compose.infra.yml 的服务内容基本一致。
# 这里保留 Docker 专用的容器名 / volume 名，优先保证本地项目隔离与可读性。
# 用法: docker compose -f deploy/dev/compose/docker-compose.dev.yml up -d
# 停止: docker compose -f deploy/dev/compose/docker-compose.dev.yml down
# 清除数据: docker compose -f deploy/dev/compose/docker-compose.dev.yml down -v

services:

  mysql:
    image: mysql:8.0.45
    container_name: kageos-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3318}:3306"
    volumes:
      - dev-mysql-data:/var/lib/mysql
      - ../../base/infra/mysql/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nats:
    image: nats:2.10.29-alpine
    container_name: kageos-dev-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
    volumes:
      - ../../base/infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["--user", "${NATS_SEED_USER:-kageos}", "--pass", "${NATS_SEED_PASSWORD:-local-dev-nats}", "-c", "/etc/nats/nats-server.conf"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: kageos-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  dev-mysql-data:
    name: kageos-dev-mysql3318-data
  dev-minio-data:
    name: kageos-dev-minio-data
