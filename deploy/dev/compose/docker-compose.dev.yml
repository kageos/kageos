# AI Agent OS - 开发环境基础设施
# 用法: docker compose -f deploy/dev/compose/docker-compose.dev.yml up -d
# 停止: docker compose -f deploy/dev/compose/docker-compose.dev.yml down
# 清除数据: docker compose -f deploy/dev/compose/docker-compose.dev.yml down -v

services:

  mysql:
    image: mysql:8.0
    container_name: ai-agent-os-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - dev-mysql-data:/var/lib/mysql
      - ../../base/infra/mysql/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nats:
    image: nats:latest
    container_name: ai-agent-os-dev-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
    volumes:
      - ../../base/infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]

  minio:
    image: minio/minio:latest
    container_name: ai-agent-os-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  dev-mysql-data:
    name: ai-agent-os-dev-mysql-data
  dev-minio-data:
    name: ai-agent-os-dev-minio-data
