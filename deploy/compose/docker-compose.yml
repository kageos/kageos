# AI Agent OS - Docker Compose 全栈一键部署
# 本文件位于 deploy/compose/，路径均相对本文件所在目录解析。
#
# 在仓库根目录执行:
#   docker compose -f deploy/compose/docker-compose.yml up -d
# 或:
#   cd deploy/compose && docker compose up -d
#
# 首次部署请先阅读 deploy/podman/DEPLOY.md

services:

  mysql:
    image: mysql:8.0
    container_name: ai-agent-os-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../podman/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ai-agent-os

  nats:
    image: nats:latest
    container_name: ai-agent-os-nats
    restart: always
    ports:
      - "4222:4222"
    volumes:
      - ../podman/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks:
      - ai-agent-os

  minio:
    image: minio/minio:latest
    container_name: ai-agent-os-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-agent-os

  backend:
    build:
      context: ../..
      dockerfile: deploy/podman/Dockerfile.backend
    image: ai-agent-os-backend:latest
    container_name: ai-agent-os-backend
    restart: always
    privileged: true
    ports:
      - "9090:9090"
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
      - "9095:9095"
      - "9096:9096"
      - "9097:9097"
    volumes:
      - ../config/compose/global.yaml:/app/configs/global.yaml:ro
      - ../config/compose/api-gateway.yaml:/app/configs/api-gateway.yaml:ro
      - ../config/compose/app-server.yaml:/app/configs/app-server.yaml:ro
      - ../config/compose/app-storage.yaml:/app/configs/app-storage.yaml:ro
      - ../config/compose/app-runtime.yaml:/app/configs/app-runtime.yaml:ro
      - ../config/compose/agent-server.yaml:/app/configs/agent-server.yaml:ro
      - ../config/compose/hr-server.yaml:/app/configs/hr-server.yaml:ro
      - ../config/compose/control-service.yaml:/app/configs/control-service.yaml:ro
      - ../config/compose/hub.yaml:/app/hub-config/hub.yaml:ro
      - podman-storage:/var/lib/containers
      - namespace-data:/app/namespace
      - app-runtime-data:/app/data
      - backend-logs:/app/logs
      - license-data:/app/license
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai-agent-os

  web:
    build:
      context: ../..
      dockerfile: deploy/podman/Dockerfile.web
    image: ai-agent-os-web:latest
    container_name: ai-agent-os-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ai-agent-os

  hub-frontend:
    build:
      context: ../..
      dockerfile: deploy/podman/Dockerfile.hub-frontend
    image: ai-agent-os-hub-frontend:latest
    container_name: ai-agent-os-hub-frontend
    restart: always
    ports:
      - "81:80"
    depends_on:
      - backend
    networks:
      - ai-agent-os

volumes:
  mysql-data:
    name: ai-agent-os-mysql-data
  minio-data:
    name: ai-agent-os-minio-data
  podman-storage:
    name: ai-agent-os-podman-storage
  namespace-data:
    name: ai-agent-os-namespace-data
  app-runtime-data:
    name: ai-agent-os-app-runtime-data
  backend-logs:
    name: ai-agent-os-backend-logs
  license-data:
    name: ai-agent-os-license-data

networks:
  ai-agent-os:
    name: ai-agent-os
    driver: bridge
