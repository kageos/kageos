server:
  port: 9094
  log_level: info
  debug: true

# 对外访问的域名或 host:port，用于生成 copy_url；不配则回退 X-Forwarded-Host / Request.Host
# public_host: "hub.example.com"
# public_host: "125.122.96.207:8999"

db:
  type: mysql
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  name: hub
  log_level: warn
  slow_threshold: 200

# 主站前端地址（Hub「试用」跳转用；开发可填 http://localhost:5173，线上填实际前端地址如 http://125.122.96.207:8999）
os:
  base_url: http://localhost:5173

