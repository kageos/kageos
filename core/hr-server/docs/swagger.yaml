definitions:
  dto.AssignUserReq:
    properties:
      department_full_path:
        description: 部门完整路径（可选，为空表示移除部门）
        example: /tech/backend
        type: string
      leader_username:
        description: Leader 用户名（可选，为空表示移除 Leader）
        example: lisi
        type: string
      username:
        description: 用户名
        example: zhangsan
        type: string
    required:
    - username
    type: object
  dto.AssignUserResp:
    properties:
      user:
        allOf:
        - $ref: '#/definitions/dto.UserInfo'
        description: 用户信息
    type: object
  dto.CompanyOption:
    properties:
      code:
        description: 企业代码
        example: acme
        type: string
      logo_url:
        description: 企业 Logo 地址
        example: https://cdn.example.com/a.png
        type: string
      name:
        description: 企业名称
        example: Acme Inc
        type: string
    type: object
  dto.CreateDepartmentReq:
    properties:
      code:
        description: 部门编码
        example: tech
        type: string
      description:
        description: 部门描述
        example: 负责技术研发
        type: string
      managers:
        description: 部门负责人（可选，多个用户名逗号分隔）
        example: zhangsan,lisi
        type: string
      name:
        description: 部门名称
        example: 技术部
        type: string
      parent_id:
        description: 父部门ID（0表示根部门）
        example: 0
        type: integer
    required:
    - code
    - name
    type: object
  dto.CreateDepartmentResp:
    properties:
      department:
        allOf:
        - $ref: '#/definitions/dto.DepartmentInfo'
        description: 部门信息
    type: object
  dto.DepartmentInfo:
    properties:
      children:
        items:
          $ref: '#/definitions/dto.DepartmentInfo'
        type: array
      code:
        type: string
      description:
        type: string
      full_code_path:
        type: string
      full_name_path:
        type: string
      id:
        type: integer
      is_system_default:
        type: boolean
      managers:
        type: string
      name:
        type: string
      parent:
        $ref: '#/definitions/dto.DepartmentInfo'
      parent_id:
        type: integer
      sort:
        type: integer
      status:
        type: string
    type: object
  dto.ForgotPasswordReq:
    properties:
      code:
        description: 验证码
        example: "123456"
        type: string
      email:
        description: 邮箱地址
        example: user@example.com
        type: string
      password:
        description: 新密码
        example: "123456"
        minLength: 6
        type: string
    required:
    - code
    - email
    - password
    type: object
  dto.ForgotPasswordResp:
    type: object
  dto.GetDepartmentResp:
    properties:
      department:
        allOf:
        - $ref: '#/definitions/dto.DepartmentInfo'
        description: 部门信息
    type: object
  dto.GetDepartmentTreeResp:
    properties:
      departments:
        description: 部门树
        items:
          $ref: '#/definitions/dto.DepartmentInfo'
        type: array
    type: object
  dto.GetDepartmentsByPathsResp:
    properties:
      departments:
        description: 部门列表
        items:
          $ref: '#/definitions/dto.DepartmentInfo'
        type: array
    type: object
  dto.GetUsersByDepartmentResp:
    properties:
      users:
        description: 用户列表
        items:
          $ref: '#/definitions/dto.UserInfo'
        type: array
    type: object
  dto.GetUsersByUsernamesReq:
    properties:
      usernames:
        description: 用户名列表，最多100个
        example:
        - '["user1"'
        - '"user2"]'
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - usernames
    type: object
  dto.GetUsersByUsernamesResp:
    properties:
      users:
        description: 用户列表
        items:
          $ref: '#/definitions/dto.UserInfo'
        type: array
    type: object
  dto.LoginReq:
    properties:
      password:
        description: 密码
        example: "123456"
        type: string
      remember:
        description: 记住我（延长Refresh Token有效期）
        example: false
        type: boolean
      username:
        description: 用户名
        example: beiluo
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResp:
    properties:
      refresh_token:
        description: 刷新Token
        example: refresh_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        description: JWT Token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        allOf:
        - $ref: '#/definitions/dto.UserInfo'
        description: 用户信息
    type: object
  dto.LogoutReq:
    properties:
      token:
        description: JWT Token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - token
    type: object
  dto.LogoutResp:
    type: object
  dto.QueryUserResp:
    properties:
      user:
        allOf:
        - $ref: '#/definitions/dto.UserInfo'
        description: 用户信息
    type: object
  dto.RefreshTokenReq:
    properties:
      refresh_token:
        description: 刷新Token
        example: refresh_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshTokenResp:
    properties:
      refresh_token:
        description: 新的Refresh Token
        example: refresh_eyJhbGciOiJIUzI1NiIsInR0cCI6IkpXVCJ9...
        type: string
      token:
        description: 新的JWT Token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  dto.RegisterReq:
    properties:
      code:
        description: 验证码
        example: "123456"
        type: string
      company_action:
        description: 企业动作：create 创建企业，join 加入企业
        enum:
        - create
        - join
        example: create
        type: string
      company_code:
        description: 企业代码，全局唯一
        example: acme
        maxLength: 64
        minLength: 2
        type: string
      company_logo_url:
        description: 企业 Logo 地址，可选
        example: https://cdn.example.com/acme.png
        type: string
      company_name:
        description: 企业名称，创建企业时必填且全局唯一
        example: Acme Inc
        type: string
      email:
        description: 邮箱
        example: beiluo@example.com
        type: string
      password:
        description: 密码
        example: "123456"
        minLength: 6
        type: string
      username:
        description: 用户 code
        example: beiluo
        maxLength: 32
        minLength: 3
        type: string
    required:
    - code
    - company_action
    - company_code
    - email
    - password
    - username
    type: object
  dto.RegisterResp:
    properties:
      user_id:
        description: 用户ID
        example: 1
        type: integer
    type: object
  dto.SearchCompaniesResp:
    properties:
      companies:
        items:
          $ref: '#/definitions/dto.CompanyOption'
        type: array
    type: object
  dto.SearchUsersFuzzyResp:
    properties:
      users:
        description: 用户列表
        items:
          $ref: '#/definitions/dto.UserInfo'
        type: array
    type: object
  dto.SendEmailCodeReq:
    properties:
      email:
        description: 邮箱地址
        example: user@example.com
        type: string
    required:
    - email
    type: object
  dto.SendEmailCodeResp:
    properties:
      debug_code:
        description: 本地 log 模式返回，生产 SMTP 模式为空
        example: "123456"
        type: string
    type: object
  dto.UpdateDepartmentReq:
    properties:
      description:
        description: 部门描述（可选）
        example: 负责技术研发
        type: string
      managers:
        description: 部门负责人（可选，多个用户名逗号分隔）
        example: zhangsan,lisi
        type: string
      name:
        description: 部门名称（可选）
        example: 技术部
        type: string
      sort:
        description: 排序（可选）
        example: 0
        type: integer
      status:
        description: 状态（可选）：active(激活), inactive(停用)
        example: active
        type: string
    type: object
  dto.UpdateDepartmentResp:
    properties:
      department:
        allOf:
        - $ref: '#/definitions/dto.DepartmentInfo'
        description: 部门信息
    type: object
  dto.UpdateUserReq:
    properties:
      avatar:
        description: 头像URL（可选，传值则更新，不传则不更新）
        example: https://avatar.com/1.jpg
        type: string
      gender:
        description: '性别（可选，传值则更新，不传则不更新）: male(男), female(女), other(其他)'
        example: male
        type: string
      nickname:
        description: 昵称（可选，传值则更新，不传则不更新）
        example: 北落
        type: string
      signature:
        description: 个人签名/简介（可选，传值则更新，不传则不更新）
        example: 这个人很懒，什么都没有留下
        type: string
    type: object
  dto.UpdateUserResp:
    properties:
      user:
        allOf:
        - $ref: '#/definitions/dto.UserInfo'
        description: 更新后的用户信息
    type: object
  dto.UserInfo:
    properties:
      avatar:
        description: 头像
        example: https://avatar.com/1.jpg
        type: string
      company_code:
        description: 企业代码
        example: acme
        type: string
      company_logo_url:
        description: 企业 Logo 地址
        example: https://cdn.example.com/acme.png
        type: string
      company_name:
        description: 企业名称
        example: Acme Inc
        type: string
      created_at:
        description: 创建时间
        example: "2024-01-01T00:00:00Z"
        type: string
      department_full_name_path:
        description: 部门完整名称路径（可选，用于展示组织架构全称）
        example: 技术部/后端组
        type: string
      department_full_path:
        description: 部门完整路径（可选）
        example: /tech/backend
        type: string
      department_name:
        description: 部门名称（可选，用于显示）
        example: 后端组
        type: string
      email:
        description: 邮箱
        example: beiluo@example.com
        type: string
      email_verified:
        description: 邮箱是否已验证
        example: true
        type: boolean
      gender:
        description: '性别: male(男), female(女), other(其他), 空字符串表示未设置'
        example: male
        type: string
      id:
        description: 用户ID
        example: 1
        type: integer
      leader_display_name:
        description: Leader 显示名称（可选，用于显示）
        example: lisi(李四)
        type: string
      leader_username:
        description: Leader 用户名（可选）
        example: lisi
        type: string
      nickname:
        description: 昵称
        example: 北落
        type: string
      register_type:
        description: 注册方式
        example: email
        type: string
      signature:
        description: 个人签名/简介
        example: 这个人很懒，什么都没有留下
        type: string
      status:
        description: '用户状态: pending(待邮箱验证), active(已激活)'
        example: active
        type: string
      username:
        description: 用户名
        example: beiluo
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:9091
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Kageos HR服务 API 文档（用户管理、组织架构、职责管理）
  license:
    name: Business Source License 1.1
    url: https://github.com/kageos/kageos/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: HR Server API
  version: "1.0"
paths:
  /hr/api/v1/auth/companies/search:
    get:
      description: 注册加入企业时，根据企业名称或企业代码搜索可加入企业
      parameters:
      - description: 搜索关键字
        in: query
        name: keyword
        type: string
      - description: 返回数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 搜索成功
          schema:
            $ref: '#/definitions/dto.SearchCompaniesResp'
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 模糊搜索企业
      tags:
      - 认证管理
  /hr/api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 验证邮箱和验证码，直接重置密码
      parameters:
      - description: 忘记密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            $ref: '#/definitions/dto.ForgotPasswordResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 忘记密码
      tags:
      - 认证管理
  /hr/api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码登录
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/dto.LoginResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 用户名或密码错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 用户登录
      tags:
      - 认证管理
  /hr/api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 用户登出，使Token失效
      parameters:
      - description: 登出请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/dto.LogoutResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 用户登出
      tags:
      - 认证管理
  /hr/api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用RefreshToken刷新JWT Token
      parameters:
      - description: 刷新Token请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/dto.RefreshTokenResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: RefreshToken无效
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 刷新Token
      tags:
      - 认证管理
  /hr/api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 使用邮箱验证码注册新用户
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/dto.RegisterResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 用户注册
      tags:
      - 认证管理
  /hr/api/v1/auth/send-email-code:
    post:
      consumes:
      - application/json
      description: 向指定邮箱发送验证码，用于注册验证
      parameters:
      - description: 发送验证码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SendEmailCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/dto.SendEmailCodeResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 发送邮箱验证码
      tags:
      - 认证管理
  /hr/api/v1/departments:
    get:
      description: 根据 full_code_path 列表批量获取部门信息
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 部门完整路径列表，多个路径用逗号分隔
        in: query
        name: full_code_paths
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetDepartmentsByPathsResp'
      summary: 批量获取部门信息
      tags:
      - 部门管理
    post:
      consumes:
      - application/json
      description: 创建新部门
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 创建部门请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDepartmentReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CreateDepartmentResp'
      summary: 创建部门
      tags:
      - 部门管理
  /hr/api/v1/departments/{id}:
    delete:
      description: 删除部门（软删除）
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: 删除部门
      tags:
      - 部门管理
    get:
      description: 根据ID获取部门详细信息
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetDepartmentResp'
      summary: 获取部门详情
      tags:
      - 部门管理
    put:
      consumes:
      - application/json
      description: 更新部门信息
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 部门ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新部门请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateDepartmentReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UpdateDepartmentResp'
      summary: 更新部门
      tags:
      - 部门管理
  /hr/api/v1/departments/tree:
    get:
      description: 获取完整的部门树结构
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.GetDepartmentTreeResp'
      summary: 获取部门树
      tags:
      - 部门管理
  /hr/api/v1/users:
    post:
      consumes:
      - application/json
      description: 根据用户名列表批量获取用户信息
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 批量查询请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GetUsersByUsernamesReq'
      produces:
      - application/json
      responses:
        "200":
          description: 用户列表
          schema:
            $ref: '#/definitions/dto.GetUsersByUsernamesResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 未认证
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 批量获取用户信息
      tags:
      - 用户管理
  /hr/api/v1/users/assignments:
    post:
      consumes:
      - application/json
      description: 分配用户的部门和 Leader
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 分配用户请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AssignUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AssignUserResp'
