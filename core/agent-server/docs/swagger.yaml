      is_default:
        example: false
        type: boolean
      max_tokens:
        example: 8196
        type: integer
      model:
        example: gpt-4
        type: string
      name:
        example: OpenAI GPT-4
        type: string
      timeout:
        example: 300
        type: integer
      visibility:
        description: '0: 公开, 1: 私有（默认0）'
        example: 0
        type: integer
    required:
    - model
    - name
    type: object
  dto.LLMCreateResp:
    properties:
