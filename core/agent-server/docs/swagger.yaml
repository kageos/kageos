paths:
  /agent/api/v1/llm/create:
    post:
      consumes:
      - application/json
      description: 创建新的LLM配置
      parameters:
      - description: 创建LLM配置请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LLMCreateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.LLMCreateResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
      summary: 创建LLM配置
      tags:
      - LLM管理
  /agent/api/v1/llm/delete:
    post:
      consumes:
      - application/json
      description: 删除LLM配置
      parameters:
      - description: LLM配置ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
        "400":
          description: 请求参数错误
          schema:
            type: string
      summary: 删除LLM配置
      tags:
      - LLM管理
  /agent/api/v1/llm/get:
    get:
      consumes:
      - application/json
      description: 根据ID获取LLM配置详细信息
      parameters:
      - description: LLM配置ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.LLMGetResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
      summary: 获取LLM配置详情
      tags:
      - LLM管理
  /agent/api/v1/llm/get_default:
    get:
      consumes:
      - application/json
      description: 获取默认的LLM配置
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.LLMGetDefaultResp'
        "400":
          description: 未设置默认配置
          schema:
            type: string
      summary: 获取默认LLM配置
      tags:
      - LLM管理
  /agent/api/v1/llm/list:
    get:
      consumes:
      - application/json
      description: 获取所有LLM配置列表
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        required: true
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: page_size
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.LLMListResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
      summary: 获取LLM配置列表
      tags:
      - LLM管理
  /agent/api/v1/llm/set_default:
    post:
      consumes:
      - application/json
      description: 设置默认的LLM配置
      parameters:
      - description: LLM配置ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 设置成功
        "400":
          description: 请求参数错误
          schema:
            type: string
      summary: 设置默认LLM配置
      tags:
      - LLM管理
  /agent/api/v1/llm/update:
    post:
      consumes:
      - application/json
      description: 更新LLM配置信息
      parameters:
      - description: 更新LLM配置请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LLMUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/dto.LLMUpdateResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
      summary: 更新LLM配置
      tags:
      - LLM管理
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-Token
    type: apiKey
  BasicAuth:
    type: basic
swagger: "2.0"
