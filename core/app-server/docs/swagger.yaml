externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:9090
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Kageos 应用管理平台 API 文档
  license:
    name: Business Source License 1.1
    url: https://github.com/kageos/kageos/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: Kageos API
  version: "1.0"
paths:
  /workspace/api/v1/app/create:
    post:
      consumes:
      - application/json
      description: 创建一个新的应用实例。租户用户（应用所有者）从请求体获取，请求用户（实际发起请求的用户）从请求头获取。租户用户决定应用的所有权，请求用户用于审计追踪。
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 创建应用请求，包含应用名（租户用户通过 header 传递）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAppReq'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/dto.CreateAppResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 未授权
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 创建应用
      tags:
      - 应用管理
  /workspace/api/v1/app/delete:
    delete:
      consumes:
      - application/json
      description: 删除应用及其所有相关资源，使用 query resource_path=/user/app 标识工作空间。
      parameters:
      - description: 工作空间资源路径，格式 /user/app
        in: query
        name: resource_path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/dto.DeleteAppResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 删除应用
      tags:
      - 应用管理
  /workspace/api/v1/app/detail:
    get:
      consumes:
      - application/json
      description: 根据 resource_path=/user/app 获取应用详情信息。
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 工作空间资源路径，格式 /user/app
        in: query
        name: resource_path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.GetAppDetailResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 未授权
          schema:
            type: string
        "404":
          description: 应用不存在
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 获取应用详情
      tags:
      - 应用管理
  /workspace/api/v1/app/list:
    get:
      consumes:
      - application/json
      description: 获取当前用户的所有应用列表（支持分页和搜索）
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - default: 1
        description: 页码，默认为1
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量，默认为10
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词（支持按应用名称或代码搜索）
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.GetAppsResp'
        "401":
          description: 未授权
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 获取应用列表
      tags:
      - 应用管理
  /workspace/api/v1/app/tree:
    get:
      consumes:
      - application/json
      description: 根据 resource_path=/user/app 获取应用详情和服务目录树（合并接口，减少请求次数）。
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 工作空间资源路径，格式 /user/app
        in: query
        name: resource_path
        required: true
        type: string
      - description: 节点类型过滤（可选），如：package（只显示服务目录/包）、function（只显示函数/文件）
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/dto.GetAppWithServiceTreeResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 未授权
          schema:
