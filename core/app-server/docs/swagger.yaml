  /workspace/api/v1/service_tree/add_functions:
    post:
      consumes:
      - application/json
      description: 接收来自 agent-server 的 Go 源码，写入到工作空间对应目录；默认同步构建，skip_build=true 时仅写文件。
      parameters:
      - description: 追踪ID（用于链路追踪）
        in: header
        name: X-Trace-Id
        type: string
      - description: 请求用户（用于审计）
        in: header
        name: X-Request-User
        type: string
      - description: Token（服务间调用时透传）
        in: header
        name: X-Token
        type: string
      - description: 添加函数请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddFunctionsReq'
      produces:
      - application/json
      responses:
        "200":
          description: 处理成功
          schema:
            $ref: '#/definitions/dto.AddFunctionsResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      summary: 向服务目录添加函数
      tags:
      - 服务目录
  /workspace/api/v1/service_tree/copy:
    post:
      consumes:
      - application/json
      description: 递归复制服务目录及其所有子目录到目标父目录下；target_directory_name 可修改复制后根目录中文展示名，同名目录已存在时可通过 replace_existing 完全替换
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 复制请求，source_directory_path=源目录完整路径，target_directory_path=目标父目录完整路径，target_directory_name=复制后根目录中文展示名，replace_existing=是否覆盖同名目录
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CopyDirectoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: 复制成功
          schema:
            $ref: '#/definitions/dto.CopyDirectoryResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 未授权
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 复制服务目录
      tags:
      - 服务目录
  /workspace/api/v1/service_tree/detail:
    get:
      consumes:
      - application/json
      description: 根据ID或full-code-path获取服务目录详情
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 服务目录ID（优先使用）
        in: query
        name: id
        type: integer
      - description: 完整代码路径（如果未提供ID则使用）
