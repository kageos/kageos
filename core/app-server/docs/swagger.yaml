definitions:
  dto.AddFunctionsReq:
    properties:
      agent_id:
        description: 智能体ID
        example: 1
        type: integer
      async:
        description: '是否异步处理（true: 异步，通过回调通知；false: 同步，直接返回结果）'
        example: false
        type: boolean
      file_name:
        description: 处理后的结构化数据（agent-server 处理后的结果）
        example: crm_ticket
        type: string
      full_code_path:
        description: 目录标识：使用 full_code_path（有语意、像函数名）；服务端据此查 ServiceTree，并从 targetTree.App
          取租户
        example: /luobei/demo/crm
        type: string
      message_id:
        description: 消息ID（关联到 AgentChatMessage.ID）
        example: 1
        type: integer
      record_id:
        description: function_gen 记录ID
        example: 1
        type: integer
      skip_build:
        description: SkipBuild 为 true 时仅写文件不编译不部署（对应 write_go_file 的 build_workspace=false）
        type: boolean
      skip_metadata_parse:
        description: SkipMetadataParse 已废弃：服务端不再解析代码内元数据，始终按 full_code_path + file_name
          写入（保留字段兼容旧客户端）
        example: false
        type: boolean
      source_code:
        description: 处理后的源代码（从 Markdown 中提取）
        example: package...
        type: string
    required:
    - full_code_path
    type: object
  dto.AddFunctionsResp:
    properties:
      app_code:
        description: 应用代码
        example: myapp
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      build_diff_add:
        description: 新增的接口/路由（如 task）
        items:
          type: string
        type: array
      build_diff_delete:
        description: 删除的接口/路由
        items:
          type: string
        type: array
      build_diff_update:
        description: 变更的接口/路由
        items:
          type: string
        type: array
      build_new_version:
        description: 编译后版本
        type: string
      build_old_version:
        description: 当 SkipBuild=false 且编译成功时，由 app-server 填充以下编译/变更信息，供 write_go_file
          返回友好提示
        type: string
      error:
        description: 错误信息（如果失败）
        example: ""
        type: string
      success:
        description: 是否成功
        example: true
        type: boolean
    type: object
  dto.ApiInfo:
    properties:
      added_version:
        description: API首次添加的版本
        type: string
      app:
        type: string
      code:
        type: string
      create_tables:
        items:
          type: string
        type: array
      desc:
        type: string
      full_code_path:
        type: string
      method:
        type: string
      name:
        type: string
      router:
        type: string
      schema:
        $ref: '#/definitions/functionschema.FunctionSchema'
      source_code:
        type: string
      source_code_file_path:
        type: string
      tags:
        items:
          type: string
        type: array
      template_type:
        type: string
      tree_id:
        description: ServiceTree节点ID，创建tree后赋值，方便后续写快照时入库
        type: integer
      update_versions:
        description: API更新过的版本列表
        items:
          type: string
        type: array
      user:
        type: string
    type: object
  dto.AppInfo:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      code:
        description: 应用代码
        example: myapp
        type: string
      created_at:
        description: 创建时间
        example: "2006-01-02 15:04:05"
        type: string
      host_id:
        description: 主机ID
        example: 1
        type: integer
      id:
        description: 应用ID
        example: 1
        type: integer
      is_public:
        description: 是否公开
        example: true
        type: boolean
      name:
        description: 应用名称
        example: 我的应用
        type: string
      nats_id:
        description: NATS ID
        example: 1
        type: integer
      show_only_permitted:
        description: 仅展示有权限的空间
        example: false
        type: boolean
      status:
        description: '状态: enabled(启用), disabled(禁用)'
        example: enabled
        type: string
      type:
        description: 应用类型：0=用户空间，1=系统空间
        example: 0
        type: integer
      updated_at:
        description: 更新时间
        example: "2006-01-02 15:04:05"
        type: string
      user:
        description: 租户名
        example: beiluo
        type: string
      version:
        description: 版本
        example: v1
        type: string
    type: object
  dto.AppVersionUpdateInfo:
    properties:
      app_version:
        description: 应用版本号
        type: string
      directory_changes:
        description: 该版本下的所有目录变更（数组）
        items:
          $ref: '#/definitions/dto.DirectoryChangeInfo'
        type: array
    type: object
  dto.ApplyPermissionReq:
    properties:
      end_time:
        description: 权限结束时间（nil 表示永久）
        type: string
      reason:
        description: 申请理由（可选）
        type: string
      resource_path:
        description: 资源路径（full-code-path）
        type: string
      role_id:
        description: 角色ID（必填）
        type: integer
      subject:
        description: 权限主体：用户名或组织架构路径，可选，默认为当前用户
        type: string
      subject_type:
        description: 权限主体类型：user（用户）或 department（部门），可选，默认为 user
        type: string
    required:
    - resource_path
    - role_id
    type: object
  dto.ApplyPermissionResp:
    properties:
      id:
        description: 申请ID（暂时返回空字符串，后续可以扩展为申请记录ID）
        type: string
      message:
        description: 响应消息
        type: string
      status:
        description: 申请状态（approved：已批准，pending：待审核）
        type: string
    type: object
  dto.ApprovePermissionRequestReq:
    properties:
      request_id:
        description: 申请记录ID
        type: integer
    required:
    - request_id
    type: object
  dto.AssignRoleToDepartmentReq:
    properties:
      app:
        example: operations
        type: string
      department_path:
        example: /org/master/bizit
        type: string
      end_time:
        type: string
      resource_path:
        example: /luobei/operations/*
        type: string
      resource_type:
        description: ⭐ 资源类型：directory、table、form、chart、app
        example: table
        type: string
      role_code:
        example: viewer
        type: string
      start_time:
        type: string
      user:
        example: luobei
        type: string
    required:
    - department_path
    - resource_path
    - resource_type
    - role_code
    type: object
  dto.AssignRoleToDepartmentResp:
    properties:
      assignment:
        $ref: '#/definitions/model.RoleAssignment'
    type: object
  dto.AssignRoleToUserReq:
    properties:
      app:
        example: operations
        type: string
      end_time:
        example: "2025-12-31T23:59:59Z"
        type: string
      resource_path:
        example: /luobei/operations/tools/*
        type: string
      resource_type:
        description: ⭐ 资源类型：directory、table、form、chart、app
        example: table
        type: string
      role_code:
        example: developer
        type: string
      start_time:
        example: "2025-01-27T00:00:00Z"
        type: string
      user:
        example: luobei
        type: string
      username:
        example: zhangsan
        type: string
    required:
    - resource_path
    - resource_type
    - role_code
    - username
    type: object
  dto.AssignRoleToUserResp:
    properties:
      assignment:
        $ref: '#/definitions/model.RoleAssignment'
    type: object
  dto.BatchGetDocsResp:
    properties:
      docs:
        description: 文档列表
        items:
          $ref: '#/definitions/dto.DocItem'
        type: array
    type: object
  dto.CopyDirectoryReq:
    properties:
      source_directory_path:
        description: 源目录完整路径或 Hub 链接（hub://host/path@version）
        example: /luobei/app_a/hr
        type: string
      target_app_id:
        description: 目标应用ID
        example: 123
        type: integer
      target_directory_path:
        description: 目标目录完整路径
        example: /luobei/app_b/hr
        type: string
    required:
    - source_directory_path
    - target_app_id
    - target_directory_path
    type: object
  dto.CopyDirectoryResp:
    properties:
      directory_count:
        description: 复制的目录数
        example: 3
        type: integer
      file_count:
        description: 复制的文件数
        example: 15
        type: integer
      git_commit_hash:
        description: Git 提交哈希
        example: abc123
        type: string
      message:
        description: 响应消息
        example: 复制目录成功，共复制 3 个目录，15 个文件
        type: string
      new_version:
        description: 新版本号
        example: v4
        type: string
      old_version:
        description: 旧版本号
        example: v3
        type: string
    type: object
  dto.CreateAppReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2,user3
        type: string
      code:
        description: 应用名
        example: myapp
        type: string
      is_public:
        description: 是否公开，默认 true（公开）
        example: true
        type: boolean
      name:
        description: 应用名
        example: 腾讯oa系统
        type: string
      show_only_permitted:
        description: 仅展示有权限的空间：开启后非管理员只看到有权限的目录
        example: false
        type: boolean
    required:
    - code
    - name
    type: object
  dto.CreateAppResp:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      app_dir:
        description: 应用目录
        example: namespace/beiluo/myapp
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    type: object
  dto.CreateBoardReq:
    properties:
      admins:
        type: string
      app:
        example: myapp
        type: string
      code:
        example: board1
        type: string
      description:
        type: string
      name:
        example: 讨论区
        type: string
      parent_full_code_path:
        description: 父目录完整路径
        example: /beiluo/myapp
        type: string
      tags:
        type: string
      user:
        example: beiluo
        type: string
    required:
    - app
    - code
    - name
    - user
    type: object
  dto.CreateBoardResp:
    properties:
      admins:
        type: string
      app_id:
        type: integer
      code:
        type: string
      description:
        type: string
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        type: string
      id:
        type: integer
      name:
        type: string
      tags:
        type: string
      type:
        description: '"board"'
        type: string
    type: object
  dto.CreateDocsReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      app:
        description: 应用名
        example: myapp
        type: string
      code:
        description: 文档代码
        example: api_docs
        type: string
      content:
        description: 文档内容
        example: |-
          # 文档内容

          这是文档内容...
        type: string
      description:
        description: 描述
        example: API接口文档
        type: string
      format:
        description: 文档格式（默认为 markdown）
        example: markdown
        type: string
      name:
        description: 文档名称
        example: API文档
        type: string
      parent_full_code_path:
        description: 父目录完整路径，空字符串表示根目录
        example: /beiluo/myapp
        type: string
      summary:
        description: 文档摘要（可选）
        example: 文档摘要
        type: string
      tags:
        description: 标签
        example: api,docs
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    required:
    - app
    - code
    - name
    - user
    type: object
  dto.CreateDocsResp:
    properties:
      admins:
        description: 管理员列表
        example: user1,user2
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      code:
        description: 文档代码
        example: api_docs
        type: string
      description:
        description: 描述
        example: API接口文档
        type: string
      doc_id:
        description: 关联的文档记录ID
        example: 1
        type: integer
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        example: /beiluo/myapp/api_docs
        type: string
      id:
        description: 文档ID
        example: 1
        type: integer
      name:
        description: 文档名称
        example: API文档
        type: string
      tags:
        description: 标签
        example: api,docs
        type: string
      type:
        description: 节点类型（固定为 docs）
        example: docs
        type: string
    type: object
  dto.CreateFunctionReq:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      code:
        description: 函数代码
        example: user_list
        type: string
      description:
        description: 描述
        example: 获取用户列表
        type: string
      directory_path:
        description: 目录完整路径
        example: /beiluo/myapp/user
        type: string
      name:
        description: 函数名称
        example: 用户列表
        type: string
      source_code:
        description: 源代码内容
        type: string
      tags:
        description: 标签
        example: user,list
        type: string
      template_type:
        description: 模板类型（form、table、chart）
        example: table
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    required:
    - app
    - code
    - directory_path
    - name
    - source_code
    - user
    type: object
  dto.CreateFunctionResp:
    properties:
      app_id:
        description: 应用ID
        example: 1
        type: integer
      code:
        description: 函数代码
        example: user_list
        type: string
      description:
        description: 描述
        example: 获取用户列表
        type: string
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        example: /beiluo/myapp/user/user_list
        type: string
      id:
        description: 函数ID
        example: 1
        type: integer
      name:
        description: 函数名称
        example: 用户列表
        type: string
      ref_id:
        description: 引用ID（指向 Function 表）
        example: 1
        type: integer
      tags:
        description: 标签
        example: user,list
        type: string
      template_type:
        description: 模板类型
        example: table
        type: string
      type:
        description: 节点类型（固定为 function）
        example: function
        type: string
      version:
        description: 函数版本号
        example: v1
        type: string
      version_num:
        description: 函数版本号（数字部分）
        example: 1
        type: integer
    type: object
  dto.CreatePackageReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      app:
        description: 应用名
        example: myapp
        type: string
      code:
        description: 目录代码
        example: user
        type: string
      description:
        description: 描述
        example: 用户相关的API接口
        type: string
      name:
        description: 目录名称
        example: 用户管理
        type: string
      parent_full_code_path:
        description: 父目录完整路径，空字符串表示根目录
        example: /beiluo/myapp
        type: string
      tags:
        description: 标签
        example: user,management
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    required:
    - app
    - code
    - name
    - user
    type: object
  dto.CreatePackageResp:
    properties:
      admins:
        description: 管理员列表
        example: user1,user2
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      code:
        description: 目录代码
        example: user
        type: string
      description:
        description: 描述
        example: 用户相关的API接口
        type: string
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        example: /beiluo/myapp/user
        type: string
      id:
        description: 目录ID
        example: 1
        type: integer
      name:
        description: 目录名称
        example: 用户管理
        type: string
      tags:
        description: 标签
        example: user,management
        type: string
      type:
        description: 节点类型（固定为 package）
        example: package
        type: string
      version:
        description: 目录版本号
        example: v1
        type: string
      version_num:
        description: 目录版本号（数字部分）
        example: 1
        type: integer
    type: object
  dto.CreatePermissionRequestReq:
    properties:
      app_id:
        description: 工作空间ID
        type: integer
      applicant_username:
        description: 申请人用户名（可选，通常从 context 获取）
        type: string
      end_time:
        description: 权限结束时间（nil 表示永久）
        type: string
      reason:
        description: 申请原因（可选）
        type: string
      resource_path:
        description: 资源路径（full-code-path）
        type: string
      role_id:
        description: 角色ID（必填）
        type: integer
      start_time:
        description: 权限开始时间（可选，默认为当前时间）
        type: string
      subject:
        description: 权限主体：用户名或组织架构路径
        type: string
      subject_type:
        description: 权限主体类型：user 或 department
        type: string
    required:
    - app_id
    - resource_path
    - role_id
    - subject
    - subject_type
    type: object
  dto.CreatePermissionRequestResp:
    properties:
      message:
        description: 响应消息
        type: string
      request_id:
        description: 申请记录ID
        type: integer
      status:
        description: 申请状态（pending：待审批）
        type: string
    type: object
  dto.CreatePostReq:
    properties:
      content:
        description: 正文（富文本）
        type: string
      content_format:
        description: markdown / html，默认 markdown
        type: string
      cover:
        description: 封面图 URL 数组（可多图）
        items:
          type: string
        type: array
      full_code_path:
        description: 版块完整路径
        type: string
      status:
        description: draft / published，默认 published
        type: string
      summary:
        description: 摘要，列表展示；可选，为空时从正文截取
        type: string
      title:
        type: string
    required:
    - full_code_path
    - title
    type: object
  dto.CreateRoleReq:
    properties:
      code:
        example: developer
        type: string
      description:
        example: 开发人员角色
        type: string
      name:
        example: 开发者
        type: string
      permissions:
        additionalProperties:
          items:
            type: string
          type: array
        description: resourceType -> []action
        type: object
    required:
    - code
    - name
    - permissions
    type: object
  dto.CreateRoleResp:
    properties:
      role:
        $ref: '#/definitions/model.Role'
    type: object
  dto.DeleteAppResp:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      user:
        description: 租户名
        example: beiluo
        type: string
    type: object
  dto.DeleteRoleResp:
    properties:
      message:
        type: string
    type: object
  dto.DiffData:
    properties:
      add:
        description: 新增的API
        items:
          $ref: '#/definitions/dto.ApiInfo'
        type: array
      delete:
        description: 删除的API
        items:
          $ref: '#/definitions/dto.ApiInfo'
        type: array
      packages:
        description: 全量 package 列表，每次 update 都返回，用于 app-server 目录对账
        items:
          $ref: '#/definitions/dto.PackageInfo'
        type: array
      update:
        description: 修改的API
        items:
          $ref: '#/definitions/dto.ApiInfo'
        type: array
    type: object
  dto.DirectoryChangeInfo:
    properties:
      added_apis:
        description: 新增的API摘要列表
        example: '[]'
        type: string
      added_count:
        description: 新增API数量
        type: integer
      app_version:
        description: 应用版本号（目录视角时使用）
        type: string
      app_version_num:
        description: 应用版本号（数字部分，目录视角时使用）
        type: integer
      change_description:
        description: 变更描述（大模型输出）
        type: string
      created_at:
        description: 创建时间
        type: string
      deleted_apis:
        description: 删除的API摘要列表
        example: '[]'
        type: string
      deleted_count:
        description: 删除API数量
        type: integer
      dir_version:
        description: 目录版本号
        type: string
      dir_version_num:
        description: 目录版本号（数字部分）
        type: integer
      directory_desc:
        description: 目录描述
        type: string
      directory_name:
        description: 目录名称
        type: string
      duration:
        description: 变更耗时（毫秒）
        type: integer
      full_code_path:
        description: 目录完整路径
        type: string
      git_commit_hash:
        description: Git 提交哈希（用于回滚）
