definitions:
  dto.AddFunctionsReq:
    properties:
      agent_id:
        description: 智能体ID
        example: 1
        type: integer
      async:
        description: '是否异步处理（true: 异步，通过回调通知；false: 同步，直接返回结果）'
        example: false
        type: boolean
      file_name:
        description: 处理后的结构化数据（agent-server 处理后的结果）
        example: crm_ticket
        type: string
      full_code_path:
        description: 目录标识：使用 full_code_path（有语意、像函数名）；服务端据此查 ServiceTree，并从 targetTree.App
          取租户
        example: /luobei/demo/crm
        type: string
      message_id:
        description: 消息ID（关联到 AgentChatMessage.ID）
        example: 1
        type: integer
      record_id:
        description: function_gen 记录ID
        example: 1
        type: integer
      skip_build:
        description: SkipBuild 为 true 时仅写文件不编译不部署（对应 write_go_file 的 build_workspace=false）
        type: boolean
      source_code:
        description: 处理后的源代码（从 Markdown 中提取）
        example: package...
        type: string
    required:
    - full_code_path
    type: object
  dto.AddFunctionsResp:
    properties:
      app_code:
        description: 应用代码
        example: myapp
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      build_diff_add:
        description: 新增的接口/路由（如 task）
        items:
          type: string
        type: array
      build_diff_delete:
        description: 删除的接口/路由
        items:
          type: string
        type: array
      build_diff_update:
        description: 变更的接口/路由
        items:
          type: string
        type: array
      build_new_version:
        description: 编译后版本
        type: string
      build_old_version:
        description: 当 SkipBuild=false 且编译成功时，由 app-server 填充以下编译/变更信息，供 write_go_file
          返回友好提示
        type: string
      error:
        description: 错误信息（如果失败）
        example: ""
        type: string
      success:
        description: 是否成功
        example: true
        type: boolean
    type: object
  dto.ApiInfo:
    properties:
      added_version:
        description: API首次添加的版本
        type: string
      app:
        type: string
      code:
        type: string
      create_tables:
        items:
          type: string
        type: array
      desc:
        type: string
      full_code_path:
        type: string
      method:
        type: string
      name:
        type: string
      router:
        type: string
      schema:
        $ref: '#/definitions/github_com_ai-agent-os_ai-agent-os_pkg_functionschema.FunctionSchema'
      tags:
        items:
          type: string
        type: array
      template_type:
        type: string
      tree_id:
        description: ServiceTree节点ID，创建tree后赋值，方便后续写快照时入库
        type: integer
      update_versions:
        description: API更新过的版本列表
        items:
          type: string
        type: array
      user:
        type: string
    type: object
  dto.AppInfo:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      code:
        description: 应用代码
        example: myapp
        type: string
      created_at:
        description: 创建时间
        example: "2006-01-02 15:04:05"
        type: string
      host_id:
        description: 主机ID
        example: 1
        type: integer
      id:
        description: 应用ID
        example: 1
        type: integer
      is_public:
        description: 是否公开
        example: true
        type: boolean
      name:
        description: 应用名称
        example: 我的应用
        type: string
      nats_id:
        description: NATS ID
        example: 1
        type: integer
      permission_enforced:
        description: 是否启用权限管控
        example: false
        type: boolean
      show_only_permitted:
        description: 仅展示有权限的空间
        example: false
        type: boolean
      status:
        description: '状态: enabled(启用), disabled(禁用)'
        example: enabled
        type: string
      type:
        description: 应用类型：0=用户空间，1=系统空间
        example: 0
        type: integer
      updated_at:
        description: 更新时间
        example: "2006-01-02 15:04:05"
        type: string
      user:
        description: 租户名
        example: beiluo
        type: string
      version:
        description: 版本
        example: v1
        type: string
    type: object
  dto.AppVersionUpdateInfo:
    properties:
      app_version:
        description: 应用版本号
        type: string
      directory_changes:
        description: 该版本下的所有目录变更（数组）
        items:
          $ref: '#/definitions/dto.DirectoryChangeInfo'
        type: array
    type: object
  dto.AssignUserReq:
    properties:
      department_full_path:
        description: 部门完整路径（可选，为空表示移除部门）
        example: /tech/backend
        type: string
      leader_username:
        description: Leader 用户名（可选，为空表示移除 Leader）
        example: lisi
        type: string
      username:
        description: 用户名
        example: zhangsan
        type: string
    required:
    - username
    type: object
  dto.AssignUserResp:
    properties:
      user:
        allOf:
        - $ref: '#/definitions/dto.UserInfo'
        description: 用户信息
    type: object
  dto.BatchGetDocsResp:
    properties:
      docs:
        description: 文档列表
        items:
          $ref: '#/definitions/dto.DocItem'
        type: array
    type: object
  dto.BatchGetUploadTokenReq:
    properties:
      files:
        description: 文件列表（最多100个）
        items:
          $ref: '#/definitions/dto.GetUploadTokenReq'
        maxItems: 100
        minItems: 1
        type: array
      upload_source:
        allOf:
        - $ref: '#/definitions/dto.UploadSource'
        description: ✨ 上传来源：browser（浏览器）或 server（服务端），默认为 browser
    required:
    - files
    type: object
  dto.BatchGetUploadTokenResp:
    properties:
      tokens:
        description: 上传凭证列表
        items:
          $ref: '#/definitions/dto.GetUploadTokenResp'
        type: array
    type: object
  dto.BatchUploadCompleteItem:
    properties:
      bucket:
        description: 存储桶；为空时使用默认桶
        type: string
      content_type:
        description: ✨ 文件类型（上传成功后需要，用于记录）
        type: string
      description:
        description: 文件描述
        type: string
      error:
        description: 错误信息（如果失败）
        type: string
      file_name:
        description: ✨ 文件名（上传成功后需要，用于记录）
        type: string
      file_size:
        description: ✨ 文件大小（上传成功后需要，用于记录）
        type: integer
      hash:
        description: ✨ 文件hash（可选，用于秒传）
        type: string
      key:
        description: 文件 Key
        type: string
      preview_kind:
        description: 预览类型：image/video
        type: string
      router:
        description: ✨ 函数路径（上传成功后需要，用于记录）
        type: string
      success:
        description: 是否成功
        type: boolean
      thumbnail_ref:
        description: 前端生成的缩略图或视频封面文件引用
        type: string
    required:
    - key
    type: object
  dto.BatchUploadCompleteReq:
    properties:
      items:
        description: 上传结果列表（最多100个）
        items:
          $ref: '#/definitions/dto.BatchUploadCompleteItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - items
    type: object
  dto.BatchUploadCompleteResp:
    properties:
      results:
        description: 处理结果列表
        items:
          $ref: '#/definitions/dto.BatchUploadCompleteResult'
        type: array
    type: object
  dto.BatchUploadCompleteResult:
    properties:
      bucket:
        description: 存储桶
        type: string
      description:
        description: 文件描述
        type: string
      download_url:
        description: ✨ 外部访问的下载地址（前端使用）
        type: string
      error:
        description: 错误信息（如果失败）
        type: string
      hash:
        description: ✨ 文件hash（用于文件缓存去重）
        type: string
      key:
        description: 文件 Key
        type: string
      preview_kind:
        description: 预览类型：image/video
        type: string
      ref:
        description: 稳定文件引用：bucket/object_key
        type: string
      server_download_url:
        description: ✨ 内部访问的下载地址（服务端使用）
        type: string
      status:
        description: 状态：completed/failed
        type: string
      thumbnail_ref:
        description: 前端生成的缩略图或视频封面文件引用
        type: string
      thumbnail_url:
        description: 缩略图或视频封面浏览器访问地址
        type: string
    type: object
  dto.CopyDirectoryReq:
    properties:
      source_directory_path:
        description: 源目录完整路径
        example: /luobei/app_a/hr
        type: string
      target_app_id:
        description: 目标应用ID
        example: 123
        type: integer
      target_directory_path:
        description: 目标目录完整路径
        example: /luobei/app_b/hr
        type: string
    required:
    - source_directory_path
    - target_app_id
    - target_directory_path
    type: object
  dto.CopyDirectoryResp:
    properties:
      directory_count:
        description: 复制的目录数
        example: 3
        type: integer
      file_count:
        description: 复制的文件数
        example: 15
        type: integer
      git_commit_hash:
        description: Git 提交哈希
        example: abc123
        type: string
      message:
        description: 响应消息
        example: 复制目录成功，共复制 3 个目录，15 个文件
        type: string
      new_version:
        description: 新版本号
        example: v4
        type: string
      old_version:
        description: 旧版本号
        example: v3
        type: string
    type: object
  dto.CreateAppReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2,user3
        type: string
      code:
        description: 应用名
        example: myapp
        type: string
      is_public:
        description: 是否公开，默认 true（公开）
        example: true
        type: boolean
      name:
        description: 应用名
        example: 腾讯oa系统
        type: string
      permission_enforced:
        description: 是否启用权限管控：社区版默认 false，企业版权限特性默认 true
        example: false
        type: boolean
      show_only_permitted:
        description: 仅展示有权限的空间：开启后非管理员只看到有权限的目录
        example: false
        type: boolean
    required:
    - code
    - name
    type: object
  dto.CreateAppResp:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      app_dir:
        description: 应用目录
        example: namespace/beiluo/myapp
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    type: object
  dto.CreateDepartmentReq:
    properties:
      code:
        description: 部门编码
        example: tech
        type: string
      description:
        description: 部门描述
        example: 负责技术研发
        type: string
      managers:
        description: 部门负责人（可选，多个用户名逗号分隔）
        example: zhangsan,lisi
        type: string
      name:
        description: 部门名称
        example: 技术部
        type: string
      parent_id:
        description: 父部门ID（0表示根部门）
        example: 0
        type: integer
    required:
    - code
    - name
    type: object
  dto.CreateDepartmentResp:
    properties:
      department:
        allOf:
        - $ref: '#/definitions/github_com_ai-agent-os_ai-agent-os_core_hr-server_model.Department'
        description: 部门信息
    type: object
  dto.CreateDocsReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      app:
        description: 应用名
        example: myapp
        type: string
      code:
        description: 文档代码
        example: api_docs
        type: string
      content:
        description: 文档内容
        example: |-
          # 文档内容

          这是文档内容...
        type: string
      description:
        description: 描述
        example: API接口文档
        type: string
      format:
        description: 文档格式（默认为 markdown）
        example: markdown
        type: string
      name:
        description: 文档名称
        example: API文档
        type: string
      parent_full_code_path:
        description: 父目录完整路径，空字符串表示根目录
        example: /beiluo/myapp
        type: string
      summary:
        description: 文档摘要（可选）
        example: 文档摘要
        type: string
      tags:
        description: 标签
        example: api,docs
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    required:
    - app
    - code
    - name
    - user
    type: object
  dto.CreateDocsResp:
    properties:
      admins:
        description: 管理员列表
        example: user1,user2
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      code:
        description: 文档代码
        example: api_docs
        type: string
      description:
        description: 描述
        example: API接口文档
        type: string
      doc_id:
        description: 关联的文档记录ID
        example: 1
        type: integer
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        example: /beiluo/myapp/api_docs
        type: string
      id:
        description: 文档ID
        example: 1
        type: integer
      name:
        description: 文档名称
        example: API文档
        type: string
      tags:
        description: 标签
        example: api,docs
        type: string
      type:
        description: 节点类型（固定为 docs）
        example: docs
        type: string
    type: object
  dto.CreateFunctionReq:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      code:
        description: 函数代码
        example: user_list
        type: string
      description:
        description: 描述
        example: 获取用户列表
        type: string
      directory_path:
        description: 目录完整路径
        example: /beiluo/myapp/user
        type: string
      name:
        description: 函数名称
        example: 用户列表
        type: string
      source_code:
        description: 源代码内容
        type: string
      tags:
        description: 标签
        example: user,list
        type: string
      template_type:
        description: 模板类型（form、table、chart）
        example: table
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    required:
    - app
    - code
    - directory_path
    - name
    - source_code
    - user
    type: object
  dto.CreateFunctionResp:
    properties:
      app_id:
        description: 应用ID
        example: 1
        type: integer
      code:
        description: 函数代码
        example: user_list
        type: string
      description:
        description: 描述
        example: 获取用户列表
        type: string
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        example: /beiluo/myapp/user/user_list
        type: string
      id:
        description: 函数ID
        example: 1
        type: integer
      name:
        description: 函数名称
        example: 用户列表
        type: string
      ref_id:
        description: 引用ID（指向 Function 表）
        example: 1
        type: integer
      tags:
        description: 标签
        example: user,list
        type: string
      template_type:
        description: 模板类型
        example: table
        type: string
      type:
        description: 节点类型（固定为 function）
        example: function
        type: string
      version:
        description: 函数版本号
        example: v1
        type: string
      version_num:
        description: 函数版本号（数字部分）
        example: 1
        type: integer
    type: object
  dto.CreatePackageReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      app:
        description: 应用名
        example: myapp
        type: string
      code:
        description: 目录代码
        example: user
        type: string
      description:
        description: 描述
        example: 用户相关的API接口
        type: string
      name:
        description: 目录名称
        example: 用户管理
        type: string
      parent_full_code_path:
        description: 父目录完整路径，空字符串表示根目录
        example: /beiluo/myapp
        type: string
      tags:
        description: 标签
        example: user,management
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    required:
    - app
    - code
    - name
    - user
    type: object
  dto.CreatePackageResp:
    properties:
      admins:
        description: 管理员列表
        example: user1,user2
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      code:
        description: 目录代码
        example: user
        type: string
      description:
        description: 描述
        example: 用户相关的API接口
        type: string
      full_code_path:
        description: 完整代码路径（父路径可由此推导）
        example: /beiluo/myapp/user
        type: string
      id:
        description: 目录ID
        example: 1
        type: integer
      name:
        description: 目录名称
        example: 用户管理
        type: string
      tags:
        description: 标签
        example: user,management
        type: string
      type:
        description: 节点类型（固定为 package）
        example: package
        type: string
      version:
        description: 目录版本号
        example: v1
        type: string
      version_num:
        description: 目录版本号（数字部分）
        example: 1
        type: integer
    type: object
  dto.CreateUserBySecretReq:
    properties:
      password:
        description: 密码
        example: "123456"
        minLength: 6
        type: string
      username:
        description: 用户名
        example: testuser
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.CreateUserBySecretResp:
    properties:
      user_id:
        description: 用户ID
        example: 1
        type: integer
    type: object
  dto.DeleteAppResp:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      user:
        description: 租户名
        example: beiluo
        type: string
    type: object
  dto.DeleteFilesByRouterReq:
    properties:
      router:
        description: 函数路径
        type: string
    required:
    - router
    type: object
  dto.DeleteFilesByRouterResp:
    properties:
      deleted_count:
        type: integer
      router:
        type: string
    type: object
  dto.DiffData:
    properties:
      add:
        description: 新增的API
        items:
          $ref: '#/definitions/dto.ApiInfo'
        type: array
      delete:
        description: 删除的API
        items:
          $ref: '#/definitions/dto.ApiInfo'
        type: array
      packages:
        description: 全量 package 列表，每次 update 都返回，用于 app-server 目录对账
        items:
          $ref: '#/definitions/dto.PackageInfo'
        type: array
      update:
        description: 修改的API
        items:
          $ref: '#/definitions/dto.ApiInfo'
        type: array
    type: object
  dto.DirectoryChangeInfo:
    properties:
      added_apis:
        description: 新增的API摘要列表
        example: '[]'
        type: string
      added_count:
        description: 新增API数量
        type: integer
      app_version:
        description: 应用版本号（目录视角时使用）
        type: string
      app_version_num:
        description: 应用版本号（数字部分，目录视角时使用）
        type: integer
      change_description:
        description: 变更描述（大模型输出）
        type: string
      created_at:
        description: 创建时间
        type: string
      deleted_apis:
        description: 删除的API摘要列表
        example: '[]'
        type: string
      deleted_count:
        description: 删除API数量
        type: integer
      dir_version:
        description: 目录版本号
        type: string
      dir_version_num:
        description: 目录版本号（数字部分）
        type: integer
      directory_desc:
        description: 目录描述
        type: string
      directory_name:
        description: 目录名称
        type: string
      duration:
        description: 变更耗时（毫秒）
        type: integer
      full_code_path:
        description: 目录完整路径
        type: string
      git_commit_hash:
        description: Git 提交哈希（用于回滚）
        type: string
      requirement:
        description: 变更需求（用户输入）
        type: string
      summary:
        description: 变更摘要（详情）
        type: string
      updated_apis:
        description: 更新的API摘要列表
        example: '[]'
        type: string
      updated_by:
        description: 更新人
        type: string
      updated_count:
        description: 更新API数量
        type: integer
    type: object
  dto.DocItem:
    properties:
      category:
        type: string
      content:
        type: string
      format:
        type: string
      full_code_path:
        type: string
      id:
        type: integer
      name:
        type: string
      summary:
        type: string
    type: object
  dto.ForgotPasswordReq:
    properties:
      code:
        description: 验证码
        example: "123456"
        type: string
      email:
        description: 邮箱地址
        example: user@example.com
