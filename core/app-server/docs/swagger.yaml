        in: query
        name: user
        type: string
      - description: 应用名（可选，用于过滤应用）
        in: query
        name: app
        type: string
      - description: 搜索关键词（可选，用于搜索名称和路径）
        in: query
        name: keyword
        type: string
      - description: 模板类型过滤（可选，如：form、table、chart）
