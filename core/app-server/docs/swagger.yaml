definitions:
  access.PermissionSet:
    additionalProperties:
      type: boolean
    type: object
  access.RoleCode:
    enum:
    - owner
    - admin
    - member
    - viewer
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleAdmin
    - RoleMember
    - RoleViewer
  dto.AddFunctionsReq:
    properties:
      file_name:
        description: 目标文件名与源码内容。
        example: crm_ticket
        type: string
      full_code_path:
        description: 目录标识：使用 full_code_path（有语意、像函数名）；服务端据此查 ServiceTree，并从 targetTree.App
          取租户。
        example: /luobei/demo/crm
        type: string
      skip_build:
        description: SkipBuild 为 true 时仅写文件不编译不部署（对应 write_go_file 的 build_workspace=false）。
        type: boolean
      source_code:
        description: 处理后的源代码（从 Markdown 中提取）
        example: package...
        type: string
    required:
    - full_code_path
    type: object
  dto.AddFunctionsResp:
    properties:
      app_code:
        description: 应用代码
        example: myapp
        type: string
      app_id:
        description: 应用ID
        example: 1
        type: integer
      build_diff_add:
        description: 新增的接口/路由（如 task）
        items:
          type: string
        type: array
      build_diff_delete:
        description: 删除的接口/路由
        items:
          type: string
        type: array
      build_diff_update:
        description: 变更的接口/路由
        items:
          type: string
        type: array
      build_new_version:
        description: 编译后版本
        type: string
      build_old_version:
        description: 当 SkipBuild=false 且编译成功时，由 app-server 填充以下编译/变更信息，供 write_go_file
          返回友好提示。
        type: string
      error:
        description: 错误信息（如果失败）
        example: ""
        type: string
      success:
        description: 是否成功
        example: true
        type: boolean
    type: object
  dto.ApiInfo:
    properties:
      added_version:
        description: API首次添加的版本
        type: string
      app:
        type: string
      code:
        type: string
      create_tables:
        items:
          type: string
        type: array
      desc:
        type: string
      full_code_path:
        type: string
      method:
        type: string
      name:
        type: string
      router:
        type: string
      schema:
        $ref: '#/definitions/functionschema.FunctionSchema'
      tags:
        items:
          type: string
        type: array
      template_type:
        type: string
      tree_id:
        description: ServiceTree节点ID，创建tree后赋值，方便后续写快照时入库
        type: integer
      update_versions:
        description: API更新过的版本列表
        items:
          type: string
        type: array
      user:
        type: string
    type: object
  dto.AppInfo:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2
        type: string
      code:
        description: 应用代码
        example: myapp
        type: string
      created_at:
        description: 创建时间
        example: "2006-01-02 15:04:05"
        type: string
      host_id:
        description: 主机ID
        example: 1
        type: integer
      id:
        description: 应用ID
        example: 1
        type: integer
      is_public:
        description: 是否公开
        example: true
        type: boolean
      name:
        description: 应用名称
        example: 我的应用
        type: string
      nats_id:
        description: NATS ID
        example: 1
        type: integer
      status:
        description: '状态: enabled(启用), disabled(禁用)'
        example: enabled
        type: string
      type:
        description: 应用类型：0=用户空间，1=系统空间
        example: 0
        type: integer
      updated_at:
        description: 更新时间
        example: "2006-01-02 15:04:05"
        type: string
      user:
        description: 租户名
        example: beiluo
        type: string
      version:
        description: 版本
        example: v1
        type: string
    type: object
  dto.AppVersionUpdateInfo:
    properties:
      app_version:
        description: 应用版本号
        type: string
      directory_changes:
        description: 该版本下的所有目录变更（数组）
        items:
          $ref: '#/definitions/dto.DirectoryChangeInfo'
        type: array
    type: object
  dto.BatchGetDocsResp:
    properties:
      docs:
        description: 文档列表
        items:
          $ref: '#/definitions/dto.DocItem'
        type: array
    type: object
  dto.CopyDirectoryReq:
    properties:
      replace_existing:
        description: 同名目录已存在时是否完全替换
        type: boolean
      source_directory_path:
        description: 源目录完整路径
        example: /luobei/app_a/hr
        type: string
      target_app_id:
        description: 目标应用ID
        example: 123
        type: integer
      target_directory_name:
        description: 复制后根目录中文展示名
        example: 人事管理
        type: string
      target_directory_path:
        description: 目标父目录完整路径
        example: /luobei/app_b
        type: string
    required:
    - source_directory_path
    - target_app_id
    - target_directory_path
    type: object
  dto.CopyDirectoryResp:
    properties:
      agent_task_count:
        description: 复制的 Agent 任务数
        example: 1
        type: integer
      directory_count:
        description: 复制的目录数
        example: 3
        type: integer
      file_count:
        description: 复制的文件数
        example: 15
        type: integer
      doc_count:
        description: 复制的文档数
        example: 2
        type: integer
      git_commit_hash:
        description: Git 提交哈希
        example: abc123
        type: string
      message:
        description: 响应消息
        example: 复制目录成功，共复制 3 个目录，15 个文件，2 份文档，1 个 Agent 任务
        type: string
      new_version:
        description: 新版本号
        example: v4
        type: string
      old_version:
        description: 旧版本号
        example: v3
        type: string
      replaced:
        description: 是否执行了同名目录完全替换
        type: boolean
      target_directory_path:
        description: 最终目标目录完整路径
        type: string
    type: object
  dto.CreateAppReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
        example: user1,user2,user3
        type: string
      code:
        description: 应用名
        example: myapp
        type: string
      is_public:
        description: 是否公开，默认 true（公开）
        example: true
        type: boolean
      name:
        description: 应用名
        example: 腾讯oa系统
        type: string
    required:
    - code
    - name
    type: object
  dto.CreateAppResp:
    properties:
      app:
        description: 应用名
        example: myapp
        type: string
      app_dir:
        description: 应用目录
        example: namespace/beiluo/myapp
        type: string
      user:
        description: 用户名
        example: beiluo
        type: string
    type: object
  dto.CreateDocsReq:
    properties:
      admins:
        description: 管理员列表，逗号分隔的用户名
