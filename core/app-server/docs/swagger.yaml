        支持两种方式：
        1. 获取当前用户权限：不传 username 和 department_full_path，系统从 context 中获取（JWT 中间件已设置）
        2. 获取指定用户权限：传递 username 和 department_full_path 参数，可以查询其他用户的权限（需要管理员权限）
      parameters:
      - description: JWT Token
        in: header
        name: X-Token
        required: true
        type: string
      - description: 工作空间资源路径，格式 /user/app
        in: query
        name: resource_path
        required: true
        type: string
      - description: 用户名（可选，不传则获取当前用户权限）
        in: query
        name: username
        type: string
      - description: 组织架构路径（可选，不传则从 context 获取）
        in: query
        name: department_full_path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/dto.GetWorkspacePermissionsResp'
        "400":
          description: 请求参数错误
          schema:
            type: string
        "401":
          description: 未授权
          schema:
            type: string
        "500":
          description: 服务器内部错误
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: 获取工作空间权限
      tags:
      - 权限管理
